services:
  # ═══════════════════════════════════════════════════
  #  База данных — ОДИН PostgreSQL на все сервисы
  # ═══════════════════════════════════════════════════
  postgres:
    image: postgres:16
    container_name: checkdev-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    restart: always

  # ═══════════════════════════════════════════════════
  #  Eureka — service discovery
  # ═══════════════════════════════════════════════════
  eureka:
    build: ../cd-eureka
    container_name: cd-eureka
    ports:
      - "9009:9009"
    restart: always
    depends_on:
      - postgres

  # ═══════════════════════════════════════════════════
  #  AUTH
  # ═══════════════════════════════════════════════════
  auth:
    build: ../cd-auth
    container_name: cd-auth
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cd_auth
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka:9009/eureka
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=true
      - EUREKA_CLIENT_FETCH_REGISTRY=true
    ports:
      - "9900:9900"
    depends_on:
      - postgres
      - eureka
    restart: always

  # ═══════════════════════════════════════════════════
  #  DESC
  # ═══════════════════════════════════════════════════
  desc:
    build: ../cd-desc
    container_name: cd-desc
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cd_desc
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka:9009/eureka
    ports:
      - "9902:9902"
    depends_on:
      - postgres
      - eureka
    restart: always

  # ═══════════════════════════════════════════════════
  #  GENERATOR
  # ═══════════════════════════════════════════════════
  generator:
    build: ../cd-generator
    container_name: cd-generator
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cd_generator
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka:9009/eureka
    ports:
      - "9903:9903"
    depends_on:
      - postgres
      - eureka
    restart: always

  # ═══════════════════════════════════════════════════
  #  MOCK
  # ═══════════════════════════════════════════════════
  mock:
    build: ../cd-mock
    container_name: cd-mock
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mock
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka:9009/eureka
    ports:
      - "9912:9912"
    depends_on:
      - postgres
      - eureka
    restart: always

  # ═══════════════════════════════════════════════════
  #  NOTIFICATION
  # ═══════════════════════════════════════════════════
  notification:
    build: ../cd-notification
    container_name: cd-notification
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cd_notification
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka:9009/eureka
    ports:
      - "9920:9920"
    depends_on:
      - postgres
      - eureka
    restart: always

  # ═══════════════════════════════════════════════════
  #  SITE — запускается ПОСЛЕДНИМ, зависит от всех
  # ═══════════════════════════════════════════════════
  site:
    build: ../cd-site
    container_name: cd-site
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka:9009/eureka
    ports:
      - "8080:8080"
    depends_on:
      - eureka
      - auth
      - desc
      - generator
      - mock
      - notification
    restart: always
